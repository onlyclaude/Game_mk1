<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>회색의 연대기</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/responsive.css">
</head>
<body>
  <div id="app">
    <div class="bg-layer" aria-hidden="true">
      <div class="bg-fog bg-fog--a"></div>
      <div class="bg-fog bg-fog--b"></div>
    </div>
    <main id="screen-root" class="screen-root"></main>
    <div id="toast-layer" class="toast-layer" aria-live="polite"></div>
    <div id="modal-layer" class="modal-layer" hidden></div>
  </div>
  <noscript>이 게임은 JavaScript가 필요합니다.</noscript>
  <script type="module" src="js/main.js"></script>

</html>
